name: Release

# 推送 v* 标签时自动构建并发布到 GitHub Release；
# 手动触发只构建并上传 artifact，方便先验证能不能打包成功。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # runner 是 en-US locale，输出被重定向时 stdout 用 cp1252，
    # 脚本里的中文 print 会抛 UnicodeEncodeError。统一走 UTF-8。
    env:
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements-desktop.txt

      - name: 运行单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          code_version="v$(python -c 'import wallpaper_cleaner; print(wallpaper_cleaner.__version__)')"
          if [ "$code_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 wallpaper_cleaner/__init__.py 里的版本号 $code_version 不一致，请先把版本号改成 ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          echo "版本号校验通过：$code_version"

      - name: 打包 exe 与 zip
        run: python packaging/build.py --skip-deps --skip-tests --skip-smoke

      # 冒烟测试直接吃 zip：测的就是要发出去的那个文件，解压之后才跑，
      # 顺带验证"配置与日志落在 exe 旁边"这条发布形态
      - name: 冒烟测试
        shell: bash
        run: |
          set -e
          zip_path=$(ls dist/wallpaper-cleaner-*.zip)
          echo "测试产物：$zip_path"
          python packaging/smoke_test.py "$zip_path"

      # 想给 exe 做代码签名的话，在这个位置插入签名步骤（需要准备证书，放在 secrets 里）。
      # 注意顺序：签名必须在「打包 exe 与 zip」之前才有效（签的是 exe，不是 zip），
      # 而校验和必须排在最后——它算的是最终发布出去的那个 zip 的哈希，
      # 任何在它之后改动产物的步骤都会让 SHA256SUMS.txt 与产物对不上。
      # 未签名的 exe 用户首次运行会遇到 SmartScreen 提示。
      - name: 生成校验和
        shell: bash
        run: |
          cd dist
          # 只对 zip 算：用户下载的是它，校验和也只应该指向它
          sha256sum wallpaper-cleaner-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-cleaner-windows
          path: |
            dist/wallpaper-cleaner-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 正文取 tag 说明，tag 页与 Release 页保持一致。
          # actions/checkout 的浅克隆只把 tag 指向的 commit 存进 refs/tags/，
          # 此时 %(contents) 会退化成 commit message（v0.2.0 就这么翻车过一次，
          # Release 正文变成了 commit subject），所以先按完整 refspec 把 tag 对象抓回来。
          git fetch --quiet --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::refs/tags/$GITHUB_REF_NAME 不是 tag 对象，读不到 tag 说明，发布已中止"
            exit 1
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          # 走文件而不是 --notes "$notes"：长文本带换行经 MSYS 传参会踩路径转换的坑。
          gh release create "$GITHUB_REF_NAME" \
            dist/wallpaper-cleaner-*.zip \
            dist/SHA256SUMS.txt \
            --title "wallpaper-cleaner $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
